services:
  db:
    image: postgres:16-alpine
    container_name: hochwasser-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  worker:
    build: . 
    restart: always
    depends_on:
      - db 
    env_file:
      - .env 
    environment:
      - DB_HOST=db

volumes:
  pgdata: